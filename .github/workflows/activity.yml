name: Activity

on:
  schedule:
    # Monday 07:22 UTC
    - cron: '22 7 * * 1'
    # Tuesday 12:47 UTC
    - cron: '47 12 * * 2'
    # Wednesday 09:03 UTC
    - cron: '3 9 * * 3'
    # Thursday 16:31 UTC
    - cron: '31 16 * * 4'
    # Friday 08:14 UTC
    - cron: '14 8 * * 5'
    # Saturday 11:52 UTC
    - cron: '52 11 * * 6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  activity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}

      - name: Push activity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "$(date -u '+%Y-%m-%d %H:%M:%S UTC') — automated activity" >> .activity
          git add .activity
          git commit --allow-empty -m "chore: activity [skip ci]"
          git push
