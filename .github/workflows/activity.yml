name: Activity

on:
  schedule:
    - cron: '22 7 * * 1'
    - cron: '47 12 * * 3'
    - cron: '14 8 * * 5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  activity:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4

      - name: Push activity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "$(date -u '+%Y-%m-%d %H:%M:%S UTC') -- automated activity" >> .activity
          git add .activity
          git commit --allow-empty -m "chore: activity [skip ci]"
          git push
