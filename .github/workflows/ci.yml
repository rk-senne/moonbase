name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Vulnerability check
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Test
        run: go test -race ./... -count=1 -timeout 300s -v 2>&1 | tee test-output.txt | grep -E "^(=== RUN|--- PASS|--- FAIL|FAIL|ok )"
        env:
          CI: "true"

      - name: Show failures
        if: failure()
        run: grep -A 10 "^--- FAIL" test-output.txt || echo "No FAIL lines found"

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Agent lint
        run: go run ./cmd/moonbase lint

      - name: Verify agents parse
        run: go test ./internal/agents/ -run TestParseAgentFile -count=1 -timeout 60s
